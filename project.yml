# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen)
# Due app che mostrano la stessa pagina (cartella Web): iPhone/iPad e Mac.
name: ArnoVideo
options:
  deploymentTarget:
    iOS: "15.0"
    macOS: "10.15"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.26.0"
    CURRENT_PROJECT_VERSION: "32"
    SWIFT_VERSION: "5.0"
targets:
  ArnoVideo:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Web
        type: folder
        buildPhase: resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: ArnoVideo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "ARNOVIDEO salva nella galleria il video che hai creato."
        NSPhotoLibraryUsageDescription: "ARNOVIDEO legge i video e le foto che scegli per metterli nella timeline."
        NSCameraUsageDescription: "ARNOVIDEO può usare la fotocamera per aggiungere un video o una foto alla timeline."
        NSHumanReadableCopyright: "© 2026 Maurizio Arnone"
    settings:
      base:
        PRODUCT_NAME: ArnoVideo
        PRODUCT_BUNDLE_IDENTIFIER: it.arnone.arnovideo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
    scheme: {}

  ArnoVideoMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Web
        type: folder
        buildPhase: resources
    info:
      path: Mac/Info.plist
      properties:
        CFBundleName: ArnoVideo
        CFBundleDisplayName: ArnoVideo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "© 2026 Maurizio Arnone"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: ArnoVideo
        PRODUCT_BUNDLE_IDENTIFIER: it.arnone.arnovideo.mac
        MACOSX_DEPLOYMENT_TARGET: "10.15"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: false
    scheme: {}
