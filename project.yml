# App iPhone/iPad che mostra la pagina della cartella Web.
name: ArnoVideo
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.0"
targets:
  ArnoVideo:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Web
        type: folder
        buildPhase: resources
    info:
      path: iOS/Info.plist
