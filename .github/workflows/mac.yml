# ARNOCUT (ex ARNOVIDEO) per Mac Catalina e successivi (Intel + chip Apple) con file di installazione .pkg e .dmg,
# pubblicata nella pagina Releases "mac-VERSIONE". La versione è quella scritta in project.yml.
name: App Mac

on:
  push:
    branches: [main, prova-mac]
    paths: ['Web/**', 'Mac/**', 'project.yml', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Legge la versione
        run: |
          VER=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' project.yml | head -1)
          test -n "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (universale)
        run: |
          set -o pipefail
          xcodebuild -project ArnoVideo.xcodeproj -scheme ArnoVideoMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO build | tail -n 60

      - name: Controlla e impacchetta
        run: |
          APP="build/Build/Products/Release/ArnoCut.app"
          lipo -archs "$APP/Contents/MacOS/ArnoCut"
          otool -l "$APP/Contents/MacOS/ArnoCut" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -4
          test -f "$APP/Contents/Resources/Web/index.html"
          echo "Librerie Swift incluse (servono su macOS prima di 10.14.4):"; ls "$APP/Contents/Frameworks" 2>/dev/null || echo "nessuna"
          otool -L "$APP/Contents/MacOS/ArnoCut" | grep -i swift | head -5 || true
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" ArnoCut-Mac-${VER}.zip
          # disco .dmg: l'app e un collegamento alla cartella Applicazioni, da trascinare
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applicazioni
          cp "Mac/Installazione/LEGGIMI - Come installare.txt" dmg/
          hdiutil create -volname "ArnoCut ${VER}" -srcfolder dmg -ov -format UDZO ArnoCut-${VER}-Catalina.dmg
          # programma di installazione .pkg: mette l'app direttamente in /Applicazioni
          mkdir -p pkgroot && cp -R "$APP" pkgroot/
          pkgbuild --analyze --root pkgroot comp.plist
          plutil -replace 0.BundleIsRelocatable -bool NO comp.plist
          pkgbuild --root pkgroot --component-plist comp.plist --identifier it.arnone.arnovideo.mac.pkg --version ${VER} \
            --install-location /Applications comp.pkg
          productbuild --package comp.pkg ArnoCut-${VER}-Catalina.pkg
          ls -lh ArnoCut-Mac-${VER}.zip ArnoCut-${VER}-Catalina.dmg ArnoCut-${VER}-Catalina.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: ArnoCut-Mac-${{ env.VER }}
          path: ArnoCut-Mac-${{ env.VER }}.zip

      - name: Pubblica nella pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view prova-mac-${VER} >/dev/null 2>&1 || gh release create prova-mac-${VER} --target prova-mac --prerelease --title "x" --notes "x"
          gh release upload prova-mac-${VER} ArnoCut-Mac-${VER}.zip ArnoCut-${VER}-Catalina.dmg ArnoCut-${VER}-Catalina.pkg --clobber
          gh release edit prova-mac-${VER} --prerelease --title "PROVA · ARNOCUT per Mac ${VER} (non definitiva)" \
            --notes "App per macOS 10.15 Catalina e successivi (Intel e chip Apple). Installazione: ArnoCut-${VER}-Catalina.pkg (doppio clic, si installa da solo in Applicazioni) oppure ArnoCut-${VER}-Catalina.dmg (trascina l'app in Applicazioni). Sostituisce ARNOVIDEO/ARNOCUT già installato e ne conserva i progetti (la vecchia app ArnoVideo si può cestinare). La prima volta: clic destro sull'app > Apri."
