# ARNOVIDEO per Mac Catalina e successivi (Intel + chip Apple) con file di installazione .pkg e .dmg,
# pubblicata nella pagina Releases "mac-VERSIONE". La versione è quella scritta in project.yml.
name: App Mac

on:
  push:
    branches: [main]
    paths: ['Web/**', 'Mac/**', 'project.yml', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Legge la versione
        run: |
          VER=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)".*/\1/p' project.yml | head -1)
          test -n "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (universale)
        run: |
          set -o pipefail
          xcodebuild -project ArnoVideo.xcodeproj -scheme ArnoVideoMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO build | tail -n 60

      - name: Controlla e impacchetta
        run: |
          APP="build/Build/Products/Release/ArnoVideo.app"
          lipo -archs "$APP/Contents/MacOS/ArnoVideo"
          otool -l "$APP/Contents/MacOS/ArnoVideo" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -4
          test -f "$APP/Contents/Resources/Web/index.html"
          echo "Librerie Swift incluse (servono su macOS prima di 10.14.4):"; ls "$APP/Contents/Frameworks" 2>/dev/null || echo "nessuna"
          otool -L "$APP/Contents/MacOS/ArnoVideo" | grep -i swift | head -5 || true
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" ArnoVideo-Mac-${VER}.zip
          # disco .dmg: l'app e un collegamento alla cartella Applicazioni, da trascinare
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applicazioni
          cp "Mac/Installazione/LEGGIMI - Come installare.txt" dmg/
          hdiutil create -volname "ArnoVideo ${VER}" -srcfolder dmg -ov -format UDZO ArnoVideo-${VER}-Catalina.dmg
          # programma di installazione .pkg: mette l'app direttamente in /Applicazioni
          mkdir -p pkgroot && cp -R "$APP" pkgroot/
          pkgbuild --analyze --root pkgroot comp.plist
          plutil -replace 0.BundleIsRelocatable -bool NO comp.plist
          pkgbuild --root pkgroot --component-plist comp.plist --identifier it.arnone.arnovideo.mac.pkg --version ${VER} \
            --install-location /Applications comp.pkg
          productbuild --package comp.pkg ArnoVideo-${VER}-Catalina.pkg
          ls -lh ArnoVideo-Mac-${VER}.zip ArnoVideo-${VER}-Catalina.dmg ArnoVideo-${VER}-Catalina.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: ArnoVideo-Mac-${{ env.VER }}
          path: ArnoVideo-Mac-${{ env.VER }}.zip

      - name: Pubblica nella pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-${VER} >/dev/null 2>&1 || gh release create mac-${VER} --target main --title "x" --notes "x"
          gh release upload mac-${VER} ArnoVideo-Mac-${VER}.zip ArnoVideo-${VER}-Catalina.dmg ArnoVideo-${VER}-Catalina.pkg --clobber
          gh release edit mac-${VER} --title "ARNOVIDEO per Mac ${VER} (Catalina e successivi)" \
            --notes "App per macOS 10.15 Catalina e successivi (Intel e chip Apple). Installazione: ArnoVideo-${VER}-Catalina.pkg (doppio clic, si installa da solo in Applicazioni) oppure ArnoVideo-${VER}-Catalina.dmg (trascina l'app in Applicazioni). Sostituisce l'ARNOVIDEO già installato e ne conserva i progetti. La prima volta: clic destro sull'app > Apri."
