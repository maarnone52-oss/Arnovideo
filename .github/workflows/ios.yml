# Compila l'app su un Mac di GitHub.
# - "Verifica": controlla che l'app si compili (non serve nessun account Apple).
# - "TestFlight": la firma e la carica su TestFlight, solo se sono stati inseriti i segreti Apple.
name: App iPhone e iPad

on:
  # Solo a mano: nel repository privato i minuti su Mac sono a consumo.
  workflow_dispatch:

jobs:
  verifica:
    name: Verifica
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Usa Xcode 26 (richiesto da Apple per TestFlight)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Su questo Mac di GitHub non c'è Xcode 26"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila (senza firma)
        run: |
          set -o pipefail
          xcodebuild -project ArnoVideo.xcodeproj -scheme ArnoVideo \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: Salva il progetto Xcode
        run: zip -qry ArnoVideo-Xcode.zip ArnoVideo.xcodeproj iOS Web project.yml

      - uses: actions/upload-artifact@v4
        with:
          name: progetto-xcode
          path: ArnoVideo-Xcode.zip

  testflight:
    name: TestFlight
    needs: verifica
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Controlla i segreti Apple
        id: check
        run: |
          if [ -n "$TEAM_ID" ] && [ -n "$BUNDLE_ID" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_P8" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Segreti Apple non inseriti: salto l'invio a TestFlight."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Prepara chiave e progetto
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Su questo Mac di GitHub non c'è Xcode 26"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version
          brew install xcodegen
          xcodegen generate

      - name: Archivia e firma
        if: steps.check.outputs.ok == 'true'
        run: |
          set -o pipefail
          xcodebuild -project ArnoVideo.xcodeproj -scheme ArnoVideo \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/ArnoVideo.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 60

      - name: Carica su TestFlight
        if: steps.check.outputs.ok == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ArnoVideo.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 60
