# Prova automatica dell'esportazione fatta dal Mac (Mac/NativeRender.swift) su un Mac di GitHub.
name: Prova esportazione Mac

on:
  push:
    branches: [main]
    paths: ['Mac/NativeRender.swift', 'test/**', '.github/workflows/test-render.yml']
  workflow_dispatch:

jobs:
  prova:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compila la prova
        run: |
          cp test/render-test.swift /tmp/main.swift
          swiftc -O Mac/NativeRender.swift /tmp/main.swift -o /tmp/prova
      - name: Esegui la prova
        run: /tmp/prova "$PWD/test/media" "$PWD/risultati"
      - name: Controllo che tutto il codice dell'app Mac si compili
        run: swiftc -typecheck Mac/*.swift -sdk "$(xcrun --show-sdk-path)" && echo "COMPILAZIONE APP OK"
      - name: Prova tele della pagina (SecurityError)
        run: |
          mkdir -p /tmp/tt && cp test/taint/taint.swift /tmp/tt/main.swift
          swiftc Mac/FileAccess.swift /tmp/tt/main.swift -o /tmp/taint
          /tmp/taint "$PWD/test/taint"
      - name: Conserva i risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-prova
          path: risultati
          retention-days: 7
